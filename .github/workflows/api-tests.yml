name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      country:
        description: Country environment
        required: true
        default: sg
        type: choice
        options: [sg, my, id]
      scenario:
        description: Scenario tag (empty = all scenarios)
        required: false
        default: create_order_success
      number_of_order:
        description: Override number_of_order for create-order scenarios
        required: false
        default: "1"
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://api-qa.ninjavan.co' }}
      API_TIMEOUT_MS: ${{ vars.API_TIMEOUT_MS || '30000' }}
      OPERATOR_LOGIN_COUNTRY: ${{ vars.OPERATOR_LOGIN_COUNTRY || 'sg' }}
      OPERATOR_CLIENT_ID: ${{ secrets.OPERATOR_CLIENT_ID }}
      OPERATOR_CLIENT_SECRET: ${{ secrets.OPERATOR_CLIENT_SECRET }}
      COUNTRY: ${{ github.event.inputs.country || 'sg' }}
      NUMBER_OF_ORDER: ${{ github.event.inputs.number_of_order || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Resolve shipper credentials for country
        env:
          SHIPPER_CLIENT_ID_SG: ${{ secrets.SHIPPER_CLIENT_ID_SG }}
          SHIPPER_CLIENT_SECRET_SG: ${{ secrets.SHIPPER_CLIENT_SECRET_SG }}
          SHIPPER_CLIENT_ID_MY: ${{ secrets.SHIPPER_CLIENT_ID_MY }}
          SHIPPER_CLIENT_SECRET_MY: ${{ secrets.SHIPPER_CLIENT_SECRET_MY }}
          SHIPPER_CLIENT_ID_ID: ${{ secrets.SHIPPER_CLIENT_ID_ID }}
          SHIPPER_CLIENT_SECRET_ID: ${{ secrets.SHIPPER_CLIENT_SECRET_ID }}
          # Optional fallbacks (single-country setups)
          SHIPPER_CLIENT_ID_FALLBACK: ${{ secrets.SHIPPER_CLIENT_ID }}
          SHIPPER_CLIENT_SECRET_FALLBACK: ${{ secrets.SHIPPER_CLIENT_SECRET }}
        run: |
          upper=$(echo "${COUNTRY}" | tr '[:lower:]' '[:upper:]')
          id_var="SHIPPER_CLIENT_ID_${upper}"
          secret_var="SHIPPER_CLIENT_SECRET_${upper}"
          id_val="${!id_var}"
          secret_val="${!secret_var}"

          if [ -z "$id_val" ] || [ -z "$secret_val" ]; then
            id_val="$SHIPPER_CLIENT_ID_FALLBACK"
            secret_val="$SHIPPER_CLIENT_SECRET_FALLBACK"
          fi

          # Trim whitespace/newlines from pasted secrets
          id_val=$(printf '%s' "$id_val" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          secret_val=$(printf '%s' "$secret_val" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          if [ -z "$id_val" ] || [ -z "$secret_val" ]; then
            echo "Missing shipper secrets for COUNTRY=${COUNTRY}"
            echo "Add repository secrets: ${id_var} and ${secret_var}"
            echo "Values must match your local config/countries/${COUNTRY}.local.env"
            exit 1
          fi

          echo "Loaded shipper credentials for ${COUNTRY} (client_id_len=${#id_val}, secret_len=${#secret_val})"
          {
            echo "SHIPPER_CLIENT_ID=${id_val}"
            echo "SHIPPER_CLIENT_SECRET=${secret_val}"
          } >> "$GITHUB_ENV"

      - name: Check required secrets
        run: |
          if [ -z "$OPERATOR_CLIENT_ID" ] || [ -z "$OPERATOR_CLIENT_SECRET" ]; then
            echo "Missing secrets: OPERATOR_CLIENT_ID and/or OPERATOR_CLIENT_SECRET"
            echo "Add them under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Operator secrets present"

      - name: Run scenarios
        id: tests
        env:
          # Inject secrets directly into this step (avoids GITHUB_ENV remapping issues)
          SHIPPER_CLIENT_ID_SG: ${{ secrets.SHIPPER_CLIENT_ID_SG }}
          SHIPPER_CLIENT_SECRET_SG: ${{ secrets.SHIPPER_CLIENT_SECRET_SG }}
          SHIPPER_CLIENT_ID_MY: ${{ secrets.SHIPPER_CLIENT_ID_MY }}
          SHIPPER_CLIENT_SECRET_MY: ${{ secrets.SHIPPER_CLIENT_SECRET_MY }}
          SHIPPER_CLIENT_ID_ID: ${{ secrets.SHIPPER_CLIENT_ID_ID }}
          SHIPPER_CLIENT_SECRET_ID: ${{ secrets.SHIPPER_CLIENT_SECRET_ID }}
          SHIPPER_CLIENT_ID: ${{ secrets.SHIPPER_CLIENT_ID }}
          SHIPPER_CLIENT_SECRET: ${{ secrets.SHIPPER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          upper=$(echo "${COUNTRY}" | tr '[:lower:]' '[:upper:]')
          id_var="SHIPPER_CLIENT_ID_${upper}"
          secret_var="SHIPPER_CLIENT_SECRET_${upper}"

          # Prefer country-specific secret, then generic fallback
          shipper_id="${!id_var:-}"
          shipper_secret="${!secret_var:-}"
          if [ -z "$shipper_id" ] || [ -z "$shipper_secret" ]; then
            shipper_id="${SHIPPER_CLIENT_ID:-}"
            shipper_secret="${SHIPPER_CLIENT_SECRET:-}"
          fi

          shipper_id=$(printf '%s' "$shipper_id" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s/^"//;s/"$//')
          shipper_secret=$(printf '%s' "$shipper_secret" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s/^"//;s/"$//')

          if [ -z "$shipper_id" ] || [ -z "$shipper_secret" ]; then
            echo "Missing shipper secrets for COUNTRY=${COUNTRY}"
            echo "Set repository secrets ${id_var} and ${secret_var}"
            echo "(or SHIPPER_CLIENT_ID / SHIPPER_CLIENT_SECRET as fallback)"
            exit 1
          fi

          export SHIPPER_CLIENT_ID="$shipper_id"
          export SHIPPER_CLIENT_SECRET="$shipper_secret"
          echo "Shipper creds for ${COUNTRY}: id_len=${#SHIPPER_CLIENT_ID} secret_len=${#SHIPPER_CLIENT_SECRET} id_suffix=...${SHIPPER_CLIENT_ID: -4}"

          ARGS=(--${COUNTRY})
          if [ -n "${{ github.event.inputs.scenario }}" ]; then
            ARGS=("${{ github.event.inputs.scenario }}" "${ARGS[@]}")
          fi
          if [ -n "${NUMBER_OF_ORDER}" ]; then
            ARGS+=(--number-of-order "${NUMBER_OF_ORDER}")
          fi
          # pipefail keeps pytest's non-zero exit (without it, tee makes the step always green)
          ./run "${ARGS[@]}" 2>&1 | tee test_output.log

      - name: Send Google Chat Notification
        if: always()
        env:
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          STATUS: ${{ job.status }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          python scripts/send_notification.py





