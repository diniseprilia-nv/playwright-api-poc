name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      country:
        description: Country environment
        required: true
        default: sg
        type: choice
        options: [sg, my, id]
      scenario:
        description: Scenario tag (empty = all scenarios)
        required: false
        default: create_order_success
      number_of_order:
        description: Override number_of_order for create-order scenarios
        required: false
        default: "1"
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://api-qa.ninjavan.co' }}
      API_TIMEOUT_MS: ${{ vars.API_TIMEOUT_MS || '30000' }}
      OPERATOR_LOGIN_COUNTRY: ${{ vars.OPERATOR_LOGIN_COUNTRY || 'sg' }}
      OPERATOR_CLIENT_ID: ${{ secrets.OPERATOR_CLIENT_ID }}
      OPERATOR_CLIENT_SECRET: ${{ secrets.OPERATOR_CLIENT_SECRET }}
      COUNTRY: ${{ github.event.inputs.country || 'sg' }}
      NUMBER_OF_ORDER: ${{ github.event.inputs.number_of_order || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Resolve shipper credentials for country
        run: |
          case "${COUNTRY}" in
            sg)
              echo "SHIPPER_CLIENT_ID=${{ secrets.SHIPPER_CLIENT_ID_SG }}" >> "$GITHUB_ENV"
              echo "SHIPPER_CLIENT_SECRET=${{ secrets.SHIPPER_CLIENT_SECRET_SG }}" >> "$GITHUB_ENV"
              ;;
            my)
              echo "SHIPPER_CLIENT_ID=${{ secrets.SHIPPER_CLIENT_ID_MY }}" >> "$GITHUB_ENV"
              echo "SHIPPER_CLIENT_SECRET=${{ secrets.SHIPPER_CLIENT_SECRET_MY }}" >> "$GITHUB_ENV"
              ;;
            id)
              echo "SHIPPER_CLIENT_ID=${{ secrets.SHIPPER_CLIENT_ID_ID }}" >> "$GITHUB_ENV"
              echo "SHIPPER_CLIENT_SECRET=${{ secrets.SHIPPER_CLIENT_SECRET_ID }}" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Check required secrets
        run: |
          missing=0
          if [ -z "$OPERATOR_CLIENT_ID" ] || [ -z "$OPERATOR_CLIENT_SECRET" ]; then
            echo "Missing secrets: OPERATOR_CLIENT_ID and/or OPERATOR_CLIENT_SECRET"
            missing=1
          fi
          if [ -z "$SHIPPER_CLIENT_ID" ] || [ -z "$SHIPPER_CLIENT_SECRET" ]; then
            echo "Missing shipper secrets for COUNTRY=${COUNTRY}"
            echo "Add SHIPPER_CLIENT_ID_${COUNTRY^^} and SHIPPER_CLIENT_SECRET_${COUNTRY^^}"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add them under Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Run scenarios
        run: |
          ARGS=(--${COUNTRY})
          if [ -n "${{ github.event.inputs.scenario }}" ]; then
            ARGS=("${{ github.event.inputs.scenario }}" "${ARGS[@]}")
          fi
          if [ -n "${NUMBER_OF_ORDER}" ]; then
            ARGS+=(--number-of-order "${NUMBER_OF_ORDER}")
          fi
          ./run "${ARGS[@]}"
