name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      country:
        description: Country environment
        required: true
        default: sg
        type: choice
        options: [sg, my, id]
      feature:
        description: Feature to run (all = every feature file)
        required: true
        default: all
        type: choice
        options: [all, create_order, create_route, archive_route]
      scenario:
        description: Scenario tag (empty = all scenarios in selected feature)
        required: false
        default: ""
      number_of_order:
        description: Override number_of_order for create-order scenarios
        required: false
        default: "1"
        type: string

jobs:
  pre-test:
    uses: ./.github/workflows/pre-test.yml

  select-features:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Build feature matrix
        id: select
        env:
          FEATURE: ${{ github.event.inputs.feature || 'all' }}
          SCENARIO: ${{ github.event.inputs.scenario || '' }}
        run: |
          set -euo pipefail
          all='[
            {"name":"create_order","path":"tests/order/steps/test_create_order.py"},
            {"name":"create_route","path":"tests/route/steps/test_create_route.py"},
            {"name":"archive_route","path":"tests/route/steps/test_archive_route.py"}
          ]'

          selected="$FEATURE"
          # If a scenario tag is given with feature=all, narrow to the matching feature.
          if { [ "$selected" = "all" ] || [ -z "$selected" ]; } && [ -n "$SCENARIO" ]; then
            tag="${SCENARIO#@}"
            case "$tag" in
              create_order*) selected="create_order" ;;
              create_route*) selected="create_route" ;;
              archive_route*) selected="archive_route" ;;
            esac
          fi

          if [ "$selected" = "all" ] || [ -z "$selected" ]; then
            echo "matrix=$(jq -c --argjson include "$all" '{include:$include}')" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(jq -c --argjson include "$all" --arg name "$selected" '{include: [$include[] | select(.name == $name)]}')" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: [pre-test, select-features]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-features.outputs.matrix) }}

    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://api-qa.ninjavan.co' }}
      API_TIMEOUT_MS: ${{ vars.API_TIMEOUT_MS || '30000' }}
      OPERATOR_LOGIN_COUNTRY: ${{ vars.OPERATOR_LOGIN_COUNTRY || 'sg' }}
      OPERATOR_CLIENT_ID: ${{ secrets.OPERATOR_CLIENT_ID }}
      OPERATOR_CLIENT_SECRET: ${{ secrets.OPERATOR_CLIENT_SECRET }}
      COUNTRY: ${{ github.event.inputs.country || 'sg' }}
      NUMBER_OF_ORDER: ${{ github.event.inputs.number_of_order || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check required secrets
        run: |
          if [ -z "$OPERATOR_CLIENT_ID" ] || [ -z "$OPERATOR_CLIENT_SECRET" ]; then
            echo "Missing secrets: OPERATOR_CLIENT_ID and/or OPERATOR_CLIENT_SECRET"
            echo "Add them under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Operator secrets present"

      - name: Run ${{ matrix.name }} feature
        id: tests
        env:
          SHIPPER_CLIENT_ID_SG: ${{ secrets.SHIPPER_CLIENT_ID_SG }}
          SHIPPER_CLIENT_SECRET_SG: ${{ secrets.SHIPPER_CLIENT_SECRET_SG }}
          SHIPPER_CLIENT_ID_MY: ${{ secrets.SHIPPER_CLIENT_ID_MY }}
          SHIPPER_CLIENT_SECRET_MY: ${{ secrets.SHIPPER_CLIENT_SECRET_MY }}
          SHIPPER_CLIENT_ID_ID: ${{ secrets.SHIPPER_CLIENT_ID_ID }}
          SHIPPER_CLIENT_SECRET_ID: ${{ secrets.SHIPPER_CLIENT_SECRET_ID }}
          SHIPPER_CLIENT_ID: ${{ secrets.SHIPPER_CLIENT_ID }}
          SHIPPER_CLIENT_SECRET: ${{ secrets.SHIPPER_CLIENT_SECRET }}
          FEATURE_PATH: ${{ matrix.path }}
          FEATURE_NAME: ${{ matrix.name }}
          SCENARIO: ${{ github.event.inputs.scenario || '' }}
        run: |
          set -euo pipefail
          upper=$(echo "${COUNTRY}" | tr '[:lower:]' '[:upper:]')
          id_var="SHIPPER_CLIENT_ID_${upper}"
          secret_var="SHIPPER_CLIENT_SECRET_${upper}"

          shipper_id="${!id_var:-}"
          shipper_secret="${!secret_var:-}"
          if [ -z "$shipper_id" ] || [ -z "$shipper_secret" ]; then
            shipper_id="${SHIPPER_CLIENT_ID:-}"
            shipper_secret="${SHIPPER_CLIENT_SECRET:-}"
          fi

          shipper_id=$(printf '%s' "$shipper_id" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s/^"//;s/"$//')
          shipper_secret=$(printf '%s' "$shipper_secret" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s/^"//;s/"$//')

          if [ -z "$shipper_id" ] || [ -z "$shipper_secret" ]; then
            echo "Missing shipper secrets for COUNTRY=${COUNTRY}"
            echo "Set repository secrets ${id_var} and ${secret_var}"
            echo "(or SHIPPER_CLIENT_ID / SHIPPER_CLIENT_SECRET as fallback)"
            exit 1
          fi

          export SHIPPER_CLIENT_ID="$shipper_id"
          export SHIPPER_CLIENT_SECRET="$shipper_secret"
          echo "Feature=${FEATURE_NAME} path=${FEATURE_PATH}"
          echo "Shipper creds for ${COUNTRY}: id_len=${#SHIPPER_CLIENT_ID} secret_len=${#SHIPPER_CLIENT_SECRET} id_suffix=...${SHIPPER_CLIENT_ID: -4}"

          CMD=(python -m pytest "${FEATURE_PATH}" --country="${COUNTRY}")
          if [ -n "${SCENARIO}" ]; then
            CMD+=(--scenario="${SCENARIO}")
          fi
          if [ -n "${NUMBER_OF_ORDER}" ]; then
            CMD+=(--number-of-order="${NUMBER_OF_ORDER}")
          fi

          echo "→ ${CMD[*]}"
          "${CMD[@]}" 2>&1 | tee "test_output_${FEATURE_NAME}.log"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.name }}
          path: test_output_${{ matrix.name }}.log
          if-no-files-found: warn
          retention-days: 7

  notify:
    needs: [pre-test, test]
    if: always()
    uses: ./.github/workflows/send-google-chat-notification.yml
    with:
      status: ${{ needs.test.result == 'skipped' && needs.pre-test.result || needs.test.result }}
      workflow_name: API Tests
    secrets:
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
